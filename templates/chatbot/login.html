<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Adaptive Defense Framework</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #07111f;
    color: white;

    display: flex;
    justify-content: center;
    align-items: center;
}

.login-container {
    width: 90%;
    max-width: 420px;
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo-icon {
    font-size: 50px;
}

.logo h1 {
    color: #55d9ff;
    font-size: 23px;
    margin-top: 10px;
}

.logo p {
    color: #8299ad;
    font-size: 12px;
    margin-top: 6px;
}

.card {
    background: #0c1b2d;
    border: 1px solid #203c56;
    border-radius: 15px;
    padding: 30px;
}

.card h2 {
    text-align: center;
    margin-bottom: 25px;
}

.input-group {
    margin-bottom: 18px;
}

label {
    display: block;
    color: #a8bacb;
    font-size: 12px;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 13px;

    background: #07111f;
    border: 1px solid #28465f;
    border-radius: 8px;

    color: white;
    outline: none;
}

input:focus {
    border-color: #55d9ff;
}

button {
    width: 100%;
    padding: 13px;

    border: none;
    border-radius: 8px;

    background: #138fd1;
    color: white;

    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #0fa8f5;
}

.message {
    text-align: center;
    margin-bottom: 15px;
    font-size: 12px;
    color: #ff626c;
}

.register-link {
    text-align: center;
    margin-top: 20px;
    color: #8299ad;
    font-size: 12px;
}

.register-link a {
    color: #55d9ff;
    text-decoration: none;
}

.home-link {
    text-align: center;
    margin-top: 15px;
}

.home-link a {
    color: #8299ad;
    font-size: 12px;
    text-decoration: none;
}

</style>

</head>

<body>

<div class="login-container">

    <div class="logo">

        <div class="logo-icon">
            🛡️
        </div>

        <h1>
            Adaptive Defense
        </h1>

        <p>
            Secure LLM Applications
        </p>

    </div>

    <div class="card">

        <h2>
            Welcome Back
        </h2>

        <form method="POST">

            {% csrf_token %}

            {% if error %}

                <div class="message">
                    {{ error }}
                </div>

            {% endif %}

            <div class="input-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required>

            </div>

            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required>

            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="register-link">

            Don't have an account?

            <a href="/register/">
                Create Account
            </a>

        </div>

        <div class="home-link">

            <a href="/">
                ← Back to Home
            </a>

        </div>

    </div>

</div>

</body>

</html>
